{% extends "index.html" %}
{% block title %}로그아웃 · 빈집을 잇다{% endblock %}
{% block content %}
<section class="panel">
  {% if me.member_id %}
  <h1>로그아웃</h1>
  <p>로그아웃하시겠어요?</p>
  <form method="post" action="{{ url_for('auth.logout') }}">
    <input type="hidden" name="csrf_token" value="{{ auth_csrf }}">
    <button class="btn btn-primary" type="submit">로그아웃</button>
    <a class="btn" href="{{ url_for('main.index') }}">홈으로</a>
  </form>
  {% else %}
  <h1>로그인되어 있지 않아요.</h1>
  <a href="{{ url_for('auth.login') }}">로그인하기</a>
  {% endif %}
</section>
{% endblock %}
