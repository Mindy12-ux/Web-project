{% extends "index.html" %}
{% block title %}로그인 · 빈집을 잇다{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<section class="panel auth-panel auth-login">
  <h1>Login</h1>
  {% if joined %}<p class="auth-success" role="status">회원가입이 완료됐어요. 로그인해 주세요.</p>{% endif %}
  {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ auth_csrf }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="member_id">아이디</label><input id="member_id" name="member_id" value="{{ member_id }}" placeholder="아이디" autocomplete="username" maxlength="50" required>
    <label for="password">비밀번호</label><input id="password" name="password" type="password" placeholder="비밀번호" autocomplete="current-password" maxlength="128" required>
    <button type="submit" class="btn btn-primary">로그인</button>
  </form>
  <p>아직 계정이 없나요? <a href="{{ url_for('auth.signup') }}">회원가입</a></p>
</section>
{% endblock %}
